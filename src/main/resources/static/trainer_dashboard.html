<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Dashboard - Vacation Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Trainer Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/calendar.html">Calendar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#changePasswordModal">Change Password</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ... -->

<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Change Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="submitPasswordChange()">Update Password</button>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4">
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h4>My Assigned Participants</h4>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover" id="assignedParticipantsTable">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Vacation Days</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Assigned participants will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Vacation Approvals</h2>
        <div>
            <button class="btn btn-outline-secondary me-2" onclick="toggleVacationView()" id="toggleViewBtn">
                Show All Requests
            </button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addParticipantModal">
                Add Participant
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover" id="pendingVacationsTable">
                <thead>
                <tr>
                    <th>Participant</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Pending vacations will be populated here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Vacation Days Modal -->
<div class="modal fade" id="editVacationDaysModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Vacation Days</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editVacationDaysForm">
                    <input type="hidden" id="editUserId" name="userId">
                    <div class="mb-3">
                        <label class="form-label">Vacation Days</label>
                        <input type="number" step="0.5" class="form-control" id="editDays" name="days" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="submitVacationDaysUpdate()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Participant Modal -->
<div class="modal fade" id="addParticipantModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Participant</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addParticipantForm">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <!-- Role is hidden and set to 'teilnehmer' -->
                    <input type="hidden" name="role" value="teilnehmer">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="submitParticipant()">Save Participant</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadDashboard);

    let currentUserId = null;
    let showAllRequests = false;

    function loadDashboard() {
        fetch('/api/me')
            .then(response => {
                if (!response.ok) throw new Error("Not logged in");
                return response.json();
            })
            .then(user => {
                if (!user) return;
                currentUserId = user.id;
                loadAssignedParticipants(user.id);
                loadVacations(user.id);
            })
            .catch(error => console.error('Error:', error));
    }

    function toggleVacationView() {
        showAllRequests = !showAllRequests;
        const btn = document.getElementById('toggleViewBtn');
        btn.innerText = showAllRequests ? "Show Pending Only" : "Show All Requests";
        loadVacations(currentUserId);
    }

    function loadAssignedParticipants(trainerId) {
        fetch(`/api/usersByTrainer?trainerId=${trainerId}`)
            .then(response => response.json())
            .then(users => {
                const tbody = document.querySelector('#assignedParticipantsTable tbody');
                tbody.innerHTML = '';
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${Math.floor(user.vacationDays)}</td>
                        <td>
                            <button class="btn btn-warning btn-sm me-1" onclick="openEditModal(${user.id}, ${user.vacationDays})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                
                if (users.length === 0) {
                     const tr = document.createElement('tr');
                     tr.innerHTML = '<td colspan="4" class="text-center">No participants assigned.</td>';
                     tbody.appendChild(tr);
                }
            });
    }

    function deleteUser(id) {
        if (!confirm('Are you sure you want to delete this user?')) {
            return;
        }

        fetch(`/api/delete/${id}`, {
            method: 'DELETE'
        })
        .then(response => response.text())
        .then(result => {
            alert(result);
            loadAssignedParticipants(currentUserId);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to delete user');
        });
    }

    function openEditModal(userId, currentDays) {
        document.getElementById('editUserId').value = userId;
        document.getElementById('editDays').value = currentDays;
        new bootstrap.Modal(document.getElementById('editVacationDaysModal')).show();
    }

    function submitVacationDaysUpdate() {
        const form = document.getElementById('editVacationDaysForm');
        const formData = new FormData(form);

        fetch('/api/updateVacationDays', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(result => {
            alert(result);
            const modal = bootstrap.Modal.getInstance(document.getElementById('editVacationDaysModal'));
            modal.hide();
            loadAssignedParticipants(currentUserId);
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to update vacation days');
        });
    }

    function loadVacations(trainerId) {
        fetch(`/api/vacationsByUser?userId=${trainerId}`)
            .then(response => response.json())
            .then(vacations => {
                const tbody = document.querySelector('#pendingVacationsTable tbody');
                tbody.innerHTML = '';
                
                // Filter based on showAllRequests flag
                const filteredVacations = showAllRequests 
                    ? vacations 
                    : vacations.filter(v => v.status === 'pending');

                filteredVacations.forEach(v => {
                    const tr = document.createElement('tr');
                    let actions = '';
                    
                    if (v.status === 'pending') {
                        actions = `
                            <button class="btn btn-success btn-sm me-1" onclick="approveVacation(${v.id})">Approve</button>
                            <button class="btn btn-danger btn-sm" onclick="denyVacation(${v.id})">Deny</button>
                        `;
                    } else {
                        actions = `<span class="badge ${v.status === 'approved' ? 'bg-success' : 'bg-danger'}">${v.status}</span>`;
                    }

                    tr.innerHTML = `
                        <td>${v.participant ? v.participant.name : '-'}</td>
                        <td>${v.startDate}</td>
                        <td>${v.endDate}</td>
                        <td>${actions}</td>
                    `;
                    tbody.appendChild(tr);
                });
                
                if (filteredVacations.length === 0) {
                     const tr = document.createElement('tr');
                     tr.innerHTML = '<td colspan="4" class="text-center">No requests found.</td>';
                     tbody.appendChild(tr);
                }
            });
    }

    function approveVacation(id) {
        fetch(`/api/approveVacation?id=${id}`, { method: 'POST' })
            .then(response => response.text())
            .then(result => {
                alert(result);
                loadVacations(currentUserId);
                loadAssignedParticipants(currentUserId);
            });
    }

    function denyVacation(id) {
        fetch(`/api/denyVacation?id=${id}`, { method: 'POST' })
            .then(response => response.text())
            .then(result => {
                alert(result);
                loadVacations(currentUserId);
            });
    }

    function submitParticipant() {
        const form = document.getElementById('addParticipantForm');
        const formData = new FormData(form);
        
        // Combine First and Last Name
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        formData.append('name', `${firstName} ${lastName}`);
        
        // Assign to current trainer
        if (currentUserId) {
            formData.append('assignedTrainerId', currentUserId);
        }

        fetch('/api/add', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(result => {
            alert(result);
            loadAssignedParticipants(currentUserId);
            const modal = bootstrap.Modal.getInstance(document.getElementById('addParticipantModal'));
            modal.hide();
            form.reset();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to add participant');
        });
    }

    function submitPasswordChange() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        const form = document.getElementById('changePasswordForm');
        const formData = new FormData(form);

        fetch('/api/changePassword', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(result => {
            alert(result);
            const modal = bootstrap.Modal.getInstance(document.getElementById('changePasswordModal'));
            modal.hide();
            form.reset();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Failed to change password');
        });
    }
</script>
</body>
</html>
